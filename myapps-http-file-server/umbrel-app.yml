manifestVersion: 1
id: myapps-http-file-server
category: files
name: HTTP File Server
version: "1.0.0"
tagline: 선택한 폴더를 HTTP로 공개하는 초경량 파일 서버
description: >-
  특정 폴더(NAS 포함)를 HTTP로 공개하는 아주 단순한 파일 서버입니다.
  하위 폴더 탐색, MP3 즉시 재생, 다운로드, URL 복사, 한글 파일명, HTTP Range 요청(구간 재생/이어받기)을
  지원하여 Galaxy Home Mini 같은 스피커에서 http://<서버IP>:8080/폴더/파일.mp3 형태로 바로 재생할 수 있습니다.
developer: me
