path: ""
defaultUsername: ""
defaultPassword: ""
submitter: me
submission: https://github.com/getumbrel/umbrel-community-app-store
releaseNotes: >-
  최초 릴리즈: 폴더 탐색, mp3 재생, 다운로드, URL 복사, 한글 파일명 지원, HTTP Range 지원.
